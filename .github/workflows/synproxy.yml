# SPDX-License-Identifier: GPL-2.0-only
# alphawrt-synproxy's nftables table on a real kernel SYN proxy: DNAT port
# forwards, a spoofed SYN flood, auto and always modes, NAT reflection and
# the box's own connections (tools/test-synproxy.sh). The WSL2 kernel has no
# nft_synproxy; GitHub's Ubuntu runners do.
name: synproxy

on:
  push:
    branches: [main]
    paths:
      - 'package/alphawrt-synproxy/**'
      - 'tools/test-synproxy.sh'
      - '.github/workflows/synproxy.yml'
  pull_request:
    paths:
      - 'package/alphawrt-synproxy/**'
      - 'tools/test-synproxy.sh'
      - '.github/workflows/synproxy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables hping3 shellcheck

      # SC3043: busybox ash, OpenWrt's /bin/sh, has "local"
      - name: Lint
        run: |
          shellcheck -s sh -S warning -e SC3043 \
            package/alphawrt-synproxy/root/usr/libexec/alphawrt/synproxy \
            package/alphawrt-synproxy/root/usr/libexec/rpcd/alphawrt-synproxy \
            package/alphawrt-synproxy/root/etc/uci-defaults/94_alphawrt_synproxy \
            tools/test-synproxy.sh

      - name: SYN proxy on a real kernel
        run: sudo REQUIRE_SYNPROXY=1 sh tools/test-synproxy.sh
