# SPDX-License-Identifier: GPL-2.0-only
# Build the GN630V images with build.sh on Linux. Run it by hand with
# "repro" ticked to build the same commit twice and compare the images.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', 'release-notes/**', '*.md']
  workflow_dispatch:
    inputs:
      repro:
        description: Build twice and compare the images
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  key:
    # The build's apk public key goes into the image, and OpenWrt makes a new
    # one per tree, so both repro builds get the same throwaway pair. Images
    # from repro runs are for the comparison only.
    if: inputs.repro
    runs-on: ubuntu-24.04
    steps:
      - run: |
          openssl ecparam -name prime256v1 -genkey -noout -out private-key.pem
          openssl ec -in private-key.pem -pubout -out public-key.pem
      - uses: actions/upload-artifact@v4
        with:
          name: repro-key
          path: '*-key.pem'
          retention-days: 1

  build:
    needs: key
    if: ${{ !cancelled() && needs.key.result != 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      matrix:
        copy: ${{ fromJSON(inputs.repro && '[1, 2]' || '[1]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: alphawrt

      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL

      - name: Build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget llvm

      - name: Clone the EN7523 tree
        run: git clone -q --filter=blob:none "$(sed -n 's/^TREE=//p' alphawrt/build.sh)" openwrt

      - if: inputs.repro
        uses: actions/download-artifact@v4
        with:
          name: repro-key
          path: openwrt

      - name: Build
        run: |
          ./alphawrt/build.sh openwrt
          git -C openwrt log -1 --format='SOURCE_DATE_EPOCH %ct (%cd)'

      - name: Checksums
        working-directory: openwrt/bin/targets/airoha/en7523
        run: sha256sum *.bin *.manifest | tee SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: gn630v-${{ matrix.copy }}
          if-no-files-found: error
          path: |
            openwrt/bin/targets/airoha/en7523/*.bin
            openwrt/bin/targets/airoha/en7523/*.manifest
            openwrt/bin/targets/airoha/en7523/*.buildinfo
            openwrt/bin/targets/airoha/en7523/SHA256SUMS

  compare:
    needs: build
    if: inputs.repro
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: gn630v-*
      - run: diff gn630v-1/SHA256SUMS gn630v-2/SHA256SUMS
