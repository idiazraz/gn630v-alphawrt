<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
	<title>AlphaWRT</title>
	<!--
		AlphaWRT logo (brand/alphawrt-mark.svg and alphawrt-wordmark.svg). Two
		symbols, referenced from the theme as logo.svg#mark and logo.svg#word, so
		their colours follow the page through the CSS custom properties logo-a
		(red), logo-b (blue) and logo-t (text). The fallbacks are the light theme.
	-->
	<defs>
		<symbol id="mark" viewBox="0 0 64 64">
			<path d="M51 12C45 30 39 50 24 50 14 50 9 42 9 33 9 22 16 14 27 14 39 14 45 34 52 47" fill="none" style="stroke:var(--logo-a, #c41e3a)" stroke-width="10.5" stroke-linecap="round"/>
			<circle cx="57" cy="55" r="6.5" style="fill:var(--logo-b, #1f6fe5)"/>
		</symbol>
		<symbol id="word" viewBox="0 0 237 52">
			<g fill="none" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
				<g style="stroke:var(--logo-t, #1c1d21)"><path d="M3.5 36.75 12.5 3.25 21.5 36.75M7 26H18M31 3.25V36.75M42 13.25V48.75M76 3.25V36.75M76 23C76 16.5 80 13.25 85 13.25 90 13.25 94 16.5 94 22V36.75M128.5 13.25V36.75"/><circle cx="53.75" cy="25" r="11.75"/><circle cx="116.75" cy="25" r="11.75"/></g>
				<path style="stroke:var(--logo-a, #c41e3a)" d="M141 3.25 147.5 36.75 155 12 162.5 36.75 169 3.25M180 36.75V3.25H190C196.5 3.25 200 7 200 12.5 200 18 196.5 21.75 190 21.75H180M191 21.75 201 36.75M209 3.25H233M221 3.25V36.75"/>
			</g>
		</symbol>
	</defs>
	<use href="#mark" width="64" height="64"/>
</svg>
